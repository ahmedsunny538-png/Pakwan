<style>
:root{
 --site-primary:#153d35;--site-on-primary:#ffffff;--site-secondary:#d6a84f;--site-on-secondary:#211707;--site-background:#101a18;
 --site-font-body:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--site-font-heading:Georgia,serif;

*{box-sizing:border-box}body{margin:0;background:var(--site-background);color:var(--ink);font-family:var(--site-font-body)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:calc(12px * var(--site-radius-scale));padding:11px 14px;background:var(--site-primary);color:var(--site-on-primary);font-weight:700}button:hover{filter:brightness(1.14)}button:disabled{opacity:.45;cursor:not-allowed}.app{min-height:100vh;background:var(--site-background);color:var(--ink)}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 22px;background:var(--site-primary);border-bottom:1px solid #ffffff24;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border:2px solid var(--site-secondary);border-radius:14px;display:grid;place-items:center;color:var(--site-secondary);font: bold 30px var(--site-font-heading);box-shadow:0 0 18px #d6a84f55}.brand h1{font:700 calc(22px * var(--site-heading-scale)) var(--site-font-heading);margin:0}.brand small{display:block;color:#e8dfc9;font-size:11px;letter-spacing:2px}.topright{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.pill{background:#ffffff18;border:1px solid #ffffff28;padding:8px 11px;border-radius:99px;font-size:12px}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 76px)}aside{padding:18px 12px;background:#14221e;border-right:1px solid var(--line)}.nav{display:grid;gap:7px}.nav button{text-align:left;background:transparent;color:var(--muted);border:1px solid transparent}.nav button.active,.nav button:hover{background:var(--surface2);border-color:var(--line);color:var(--ink)}.nav .navicon{display:inline-block;width:26px;color:var(--gold)}main{padding:24px;max-width:1600px;width:100%;margin:auto}.pagehead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:20px}.pagehead h2{font:700 calc(30px * var(--site-heading-scale)) var(--site-font-heading);margin:0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat,.panel{background:var(--surface);border:1px solid var(--line);border-radius:calc(17px * var(--site-radius-scale));padding:17px;box-shadow:0 10px 30px #0002}.stat label{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:26px;margin-top:8px}.stat small{color:var(--green)}.columns{display:grid;grid-template-columns:1.3fr 1fr;gap:15px;margin-top:16px}.panel h3{margin:0 0 14px;font:700 19px var(--site-font-heading)}.bars{height:180px;display:flex;align-items:end;gap:10px;border-bottom:1px solid var(--line);padding:12px 4px 0}.bar{flex:1;background:linear-gradient(0deg,var(--site-primary),var(--green));border-radius:8px 8px 0 0;min-height:5px;position:relative}.bar span{position:absolute;bottom:-23px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}.quick{display:flex;gap:9px;flex-wrap:wrap}.quick button{background:var(--surface2);border:1px solid var(--line)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{background:#101c18;border:1px solid var(--line);color:var(--ink);padding:11px;border-radius:10px;min-width:0;width:100%}.toolbar input{flex:1;min-width:160px}.categoryrow{display:flex;gap:8px;overflow:auto;padding:3px 0 12px}.categoryrow button{white-space:nowrap;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}.categoryrow button.active{background:var(--site-secondary);color:#211707}.menu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.dish{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:7px}.dish .dishname{font-weight:800}.dish .sub{font-size:11px;color:var(--muted)}.dish .price{color:var(--gold);font-weight:800}.dish button{margin-top:auto;width:100%;padding:9px}.posgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,.8fr);gap:15px}.cartline{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.cartline small{display:block;color:var(--muted)}.qty{display:flex;align-items:center;gap:6px}.qty button{padding:4px 9px;border-radius:8px}.totals{display:grid;gap:8px;margin-top:14px}.totalrow{display:flex;justify-content:space-between;color:var(--muted)}.grand{font-size:21px;color:var(--gold);font-weight:900;border-top:1px solid var(--line);padding-top:12px}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--gold);font-weight:700}.tag{font-size:10px;padding:4px 8px;border-radius:99px;background:#315348;color:#c5f5dd}.danger{background:#713b37}.gold{background:var(--site-secondary);color:#211707}.soft{background:var(--surface2);border:1px solid var(--line)}.notice{padding:12px;border:1px solid #8c713e;background:#59472733;color:#f2d99d;border-radius:12px;margin-bottom:15px;font-size:13px}.hidden{display:none!important}.empty{color:var(--muted);text-align:center;padding:25px}.bill{background:#fff;color:#171717;padding:22px;max-width:380px;margin:auto;font-family:Arial,sans-serif}.bill .billlogo{font:bold 36px Georgia;color:#17483d;text-align:center}.bill h2,.bill p{text-align:center;margin:5px}.bill table{min-width:0;color:#171717}.bill th,.bill td{padding:6px 3px;color:#171717;border-bottom:1px dashed #aaa;font-size:12px}.bill .btotal{font-weight:bold;border-top:1px solid #111;padding-top:8px}.switchline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.langbar{display:flex;gap:6px}.langbar button{padding:7px 10px;font-size:11px;background:#ffffff19;border:1px solid #ffffff2a}.langbar button.active{background:var(--site-secondary);color:#211707}.foot{margin-top:22px;color:var(--muted);font-size:11px;text-align:center}
@media(max-width:950px){.layout{grid-template-columns:1fr}aside{padding:8px;border-right:0;border-bottom:1px solid var(--line);position:sticky;top:76px;z-index:4}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.navicon{display:none!important}.grid{grid-template-columns:repeat(2,1fr)}.columns,.posgrid{grid-template-columns:1fr}.menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:16px}}@media(max-width:560px){.top{padding:12px}.brand h1{font-size:17px}.logo{width:38px;height:38px}.topright .pill{display:none}.menu-grid{grid-template-columns:1fr 1fr}.dish{padding:10px}.pagehead h2{font-size:24px}.grid{gap:8px}.stat{padding:12px}.stat strong{font-size:21px}.formgrid{grid-template-columns:1fr}}
@media print{body{background:#fff!important}.no-print{display:none!important}.bill{display:block!important;box-shadow:none!important;margin:0 auto;padding:10px}.bill table{min-width:0}}

<body><div class="app" id="app">
<header class="top"><div class="brand"><div class="logo">S</div><div><h1 id="brandTitle">AGHAI PAKWAN CENTER</h1><small>PAKWAN CENTER MANAGEMENT</small></div></div><div class="topright"><div class="langbar no-print"><button data-lang="en" class="active">EN</button><button data-lang="ur">اردو</button><button data-lang="ro">ROMAN</button></div><span class="pill" id="licenseBadge">20 DAY TRIAL</span><button class="gold" onclick="showPage('settings')">⚙</button></div></header>
<div class="layout"><aside class="no-print"><nav class="nav" id="nav"><button class="active" data-page="dashboard"><span class="navicon">▦</span>Dashboard</button><button data-page="counter"><span class="navicon">▣</span>Counter / POS</button><button data-page="menu"><span class="navicon">☷</span>Food Menu</button><button data-page="sales"><span class="navicon">▤</span>Sales & Reports</button><button data-page="settings"><span class="navicon">⚙</span>Settings / Admin</button></nav></aside><main id="main"></main></div></div>
<script>
const money=n=>'Rs. '+Number(n||0).toLocaleString('en-PK',{maximumFractionDigits:2});
const initial=[
['Chicken Biryani','چکن بریانی','Chicken Biryani','Rice',260,'plate','Full'],['Chicken Biryani Half','آدھی چکن بریانی','Aadhi Chicken Biryani','Rice',150,'plate','Half'],['Beef Pulao','بیف پلاؤ','Beef Pulao','Rice',320,'plate','Full'],['Daal Chawal','دال چاول','Daal Chawal','Rice',180,'plate','Full'],['Chicken Karahi','چکن کڑاہی','Chicken Karahi','Karahi',1450,'kg','1 Kg'],['Chicken Karahi Half','آدھی کڑاہی','Aadhi Karahi','Karahi',760,'kg','Half Kg'],['Mutton Karahi','مٹن کڑاہی','Mutton Karahi','Karahi',2600,'kg','1 Kg'],['Chicken Handi','چکن ہانڈی','Chicken Handi','Handi',1250,'kg','Full'],['Beef Qorma','بیف قورمہ','Beef Qorma','Salan',350,'plate','Plate'],['Nihari','نہاری','Nihari','Salan',380,'plate','Plate'],['Seekh Kebab','سیخ کباب','Seekh Kebab','BBQ',180,'piece','1 Piece'],['Chicken Tikka','چکن تکہ','Chicken Tikka','BBQ',420,'piece','1 Piece'],['Gulab Jamun','گلاب جامن','Gulab Jamun','Sweets',50,'piece','1 Piece'],['Kheer','کھیر','Kheer','Sweets',120,'cup','1 Cup'],['Zarda','زردہ','Zarda','Sweets',180,'plate','Plate'],['Cold Drink','کولڈ ڈرنک','Cold Drink','Drinks',100,'bottle','1 Bottle'],['Raita','رائتہ','Raita','Extras',80,'bowl','1 Bowl'],['Fresh Roti','سادہ روٹی','Saada Roti','Extras',20,'piece','1 Piece']
].map((a,i)=>({id:i+1,en:a[0],ur:a[1],ro:a[2],cat:a[3],price:a[4],unit:a[5],portion:a[6]}));
let db=JSON.parse(localStorage.getItem('aghaiPakwanDB')||'null')||{name:'AGHAI 21 PAKWAN CENTER',items:initial,orders:[],cart:[],discount:0,gst:0,lang:'en',currency:'Rs.',ownerPin:'7860',trialStart:Date.now(),licenseUntil:0,customer:'Walk-in Customer',orderType:'Dine In'};
const save=()=>localStorage.setItem('aghaiPakwanDB',JSON.stringify(db));let page='dashboard',cat='All',search='';
const cats=['All','Rice','Karahi','Handi','Salan','BBQ','Sweets','Drinks','Extras','Fast Food','Other'];
const tr={en:{dashboard:'Dashboard',counter:'Counter / POS',menu:'Food Menu',sales:'Sales & Reports',settings:'Settings / Admin',today:'Today Sales',orders:'Orders Today',avg:'Average Bill',items:'Menu Items',quick:'Quick Actions',popular:'Popular Dishes',counterTitle:'Restaurant Counter',search:'Search dishes...',cart:'Current Order',customer:'Customer Name',orderType:'Order Type',dine:'Dine In',take:'Take Away',delivery:'Delivery',discount:'Discount (Rs.)',gst:'GST (%)',subtotal:'Subtotal',total:'Grand Total',pay:'Complete & Save Bill',print:'Print Bill',add:'Add New Dish',save:'Save Dish',category:'Category',price:'Price',portion:'Portion',quantity:'Qty',reports:'Recent Sales',settingsTitle:'Business & Owner Settings',business:'Business Name',pin:'Owner PIN',activate:'Activate License',days:'Trial / License',menuPrint:'Print Menu',export:'Export Sales CSV',reset:'Reset Demo Data'},ur:{dashboard:'سیلز ڈیش بورڈ',counter:'کاؤنٹر / بلنگ',menu:'کھانے کا مینیو',sales:'سیلز رپورٹس',settings:'سیٹنگز / ایڈمن',today:'آج کی سیل',orders:'آج کے آرڈر',avg:'اوسط بل',items:'مینیو آئٹمز',quick:'فوری آپشنز',popular:'مشہور کھانے',counterTitle:'ریسٹورنٹ کاؤنٹر',search:'کھانا تلاش کریں...',cart:'موجودہ آرڈر',customer:'کسٹمر کا نام',orderType:'آرڈر کی قسم',dine:'یہاں کھائیں',take:'پارسل',delivery:'ڈیلیوری',discount:'ڈسکاؤنٹ (روپے)',gst:'جی ایس ٹی (%)',subtotal:'سب ٹوٹل',total:'کل رقم',pay:'بل محفوظ کریں',print:'بل پرنٹ',add:'نئی ڈش شامل کریں',save:'ڈش محفوظ کریں',category:'کیٹیگری',price:'ریٹ',portion:'پورشن',quantity:'تعداد',reports:'حالیہ سیلز',settingsTitle:'کاروبار اور ایڈمن سیٹنگز',business:'کاروبار کا نام',pin:'اونر پن',activate:'لائسنس ایکٹیویٹ کریں',days:'ٹرائل / لائسنس',menuPrint:'مینیو پرنٹ',export:'سیلز ایکسپورٹ',reset:'ڈیمو ڈیٹا ری سیٹ'},ro:{dashboard:'Sales Dashboard',counter:'Counter / Billing',menu:'Khanay ka Menu',sales:'Sales Reports',settings:'Settings / Admin',today:'Aaj ki Sales',orders:'Aaj ke Orders',avg:'Average Bill',items:'Menu Items',quick:'Quick Options',popular:'Mashhoor Dishes',counterTitle:'Restaurant Counter',search:'Dish search karein...',cart:'Current Order',customer:'Customer ka Naam',orderType:'Order ki Qisam',dine:'Yahin Khana',take:'Parcel',delivery:'Delivery',discount:'Discount (Rs.)',gst:'GST (%)',subtotal:'Subtotal',total:'Total Raqam',pay:'Bill Save Karein',print:'Bill Print',add:'Nayi Dish Add Karein',save:'Dish Save Karein',category:'Category',price:'Rate',portion:'Portion',quantity:'Tadaad',reports:'Recent Sales',settingsTitle:'Business aur Admin Settings',business:'Business ka Naam',pin:'Owner PIN',activate:'License Activate Karein',days:'Trial / License',menuPrint:'Menu Print',export:'Sales CSV Export',reset:'Demo Data Reset'}};
const T=k=>(tr[db.lang]||tr.en)[k]||k;const dateKey=()=>new Date().toLocaleDateString('en-CA');const todayOrders=()=>db.orders.filter(o=>o.date===dateKey());const totalSales=arr=>arr.reduce((s,o)=>s+o.total,0);const fmtDate=x=>new Date(x).toLocaleString();
function showPage(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{db.lang=b.dataset.lang;save();document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('active',x===b));render()});
function license(){let elapsed=Math.floor((Date.now()-db.trialStart)/86400000),left=Math.max(0,20-elapsed);let active=db.licenseUntil>Date.now();document.getElementById('licenseBadge').textContent=active?'LICENSE ACTIVE':left+' DAYS TRIAL';return {left,active,blocked:!active&&left<=0}}
function render(){document.getElementById('brandTitle').textContent=db.name;license();let m=document.getElementById('main');if(license().blocked&&page!=='settings'){m.innerHTML=`<div class="panel"><h2>Software Locked / Access Expired</h2><p class="muted">20 din ka trial mukammal ho gaya. Owner se activation PIN hasil karein.</p><button onclick="showPage('settings')">Admin Activation</button></div>`;return}if(page==='dashboard')dashboard(m);if(page==='counter')counter(m);if(page==='menu')menuPage(m);if(page==='sales')salesPage(m);if(page==='settings')settingsPage(m)}
function dashboard(m){let orders=todayOrders(),sales=totalSales(orders),all=db.orders.slice().reverse().slice(0,5),max=Math.max(1,...Array.from({length:7},(_,i)=>totalSales(db.orders.filter(o=>new Date(o.time).toDateString()===new Date(Date.now()-i*86400000).toDateString()))));let bars=Array.from({length:7},(_,i)=>{let d=new Date(Date.now()-(6-i)*86400000),v=totalSales(db.orders.filter(o=>new Date(o.time).toDateString()===d.toDateString()));return `<div class="bar" style="height:${Math.max(4,v/max*100)}%"><span>${d.toLocaleDateString('en',{weekday:'short'})}</span></div>`}).join('');m.innerHTML=`<div class="pagehead"><div><p class="muted">WELCOME TO YOUR BUSINESS</p><h2>${T('dashboard')}</h2><p class="muted">${new Date().toLocaleDateString()}</p></div><button class="gold" onclick="showPage('counter')">＋ New Order</button></div><div class="grid"><div class="stat"><label>${T('today')}</label><strong>${money(sales)}</strong><small>Today's revenue</small></div><div class="stat"><label>${T('orders')}</label><strong>${orders.length}</strong><small>Saved transactions</small></div><div class="stat"><label>${T('avg')}</label><strong>${money(orders.length?sales/orders.length:0)}</strong><small>Per order</small></div><div class="stat"><label>${T('items')}</label><strong>${db.items.length}</strong><small>Active dishes</small></div></div><div class="columns"><section class="panel"><h3>Sales Overview · 7 Days</h3><div class="bars">${bars}</div></section><section class="panel"><h3>${T('quick')}</h3><div class="quick"><button onclick="showPage('counter')">＋ New Bill</button><button onclick="showPage('menu')">☷ Manage Menu</button><button onclick="printMenu()">▤ ${T('menuPrint')}</button><button onclick="showPage('sales')">▥ Reports</button></div><h3 style="margin-top:22px">${T('popular')}</h3>${db.items.slice(0,5).map(x=>`<div class="switchline"><span>${x.en}</span><b>${money(x.price)}</b></div>`).join('')}</section></div><section class="panel" style="margin-top:15px"><h3>${T('reports')}</h3>${ordersTable(all)}</section>`}
function dishName(x){return db.lang==='ur'?x.ur:db.lang==='ro'?x.ro:x.en}
function menuPage(m){let list=db.items.filter(x=>(cat==='All'||x.cat===cat)&&[x.en,x.ur,x.ro,x.cat].join(' ').toLowerCase().includes(search.toLowerCase()));m.innerHTML=`<div class="pagehead"><div><h2>${T('menu')}</h2><p class="muted">Dishes, sweets, portions aur rates manage karein</p></div><div class="quick"><button class="gold" onclick="printMenu()">▤ ${T('menuPrint')}</button><button onclick="document.getElementById('addForm').classList.toggle('hidden')">＋ ${T('add')}</button></div></div><div class="panel hidden" id="addForm"><h3>${T('add')}</h3><div class="formgrid"><div class="field"><label>English Name</label><input id="newEn" placeholder="Chicken Biryani"></div><div class="field"><label>Urdu Name</label><input id="newUr" placeholder="چکن بریانی"></div><div class="field"><label>Roman Urdu</label><input id="newRo" placeholder="Chicken Biryani"></div><div class="field"><label>${T('category')}</label><select id="newCat">${cats.slice(1).map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>${T('price')} (Rs.)</label><input id="newPrice" type="number" min="0" value="100"></div><div class="field"><label>${T('portion')}</label><select id="newUnit"><option>plate</option><option>kg</option><option>gram</option><option>piece</option><option>packet</option><option>cup</option><option>tray</option><option>liter</option></select></div></div><button class="gold" onclick="addDish()">${T('save')}</button></div><div class="toolbar"><input placeholder="${T('search')}" value="${search}" oninput="search=this.value;menuPage(document.getElementById('main'))"><button class="soft" onclick="search='';menuPage(document.getElementById('main'))">Clear</button></div><div class="categoryrow">${cats.map(c=>`<button class="${cat===c?'active':''}" onclick="cat='${c}';menuPage(document.getElementById('main'))">${c}</button>`).join('')}</div><div class="menu-grid">${list.map(x=>`<div class="dish"><div class="dishname">${dishName(x)}</div><div class="sub">${x.en} · ${x.cat} · ${x.portion||x.unit}</div><div class="price">${money(x.price)} / ${x.unit}</div><div class="quick"><button class="soft" onclick="editDish(${x.id})">Edit</button><button class="danger" onclick="deleteDish(${x.id})">Delete</button></div></div>`).join('')||'<div class="empty">No dishes found</div>'}</div>`}
function addDish(){let en=document.getElementById('newEn').value.trim(),ur=document.getElementById('newUr').value.trim(),ro=document.getElementById('newRo').value.trim(),price=Number(document.getElementById('newPrice').value);if(!en||!price){alert('English name aur rate lazmi hain');return}let unit=document.getElementById('newUnit').value,portion=prompt('Portion name (Full / Half / Quarter / Plate / 1 Kg)', 'Full');if(portion===null)return;db.items.push({id:Date.now(),en,ur:ur||en,ro:ro||en,cat:document.getElementById('newCat').value,price,unit,portion:portion.trim()||unit});save();menuPage(document.getElementById('main'))}
function editDish(id){let x=db.items.find(a=>a.id===id);if(!x)return;let en=prompt('English name',x.en);if(en===null)return;let ur=prompt('Urdu name',x.ur);if(ur===null)return;let ro=prompt('Roman Urdu name',x.ro);if(ro===null)return;let catName=prompt('Category',x.cat);if(catName===null)return;let price=prompt('Rate (Rs.)',x.price);if(price===null||price.trim()===''||!Number.isFinite(Number(price))||Number(price)<0){alert('Valid rate enter karein');return}let unit=prompt('Unit (plate / kg / gram / piece / packet / cup)',x.unit);if(unit===null)return;let portion=prompt('Portion (Full / Half / Quarter / Plate / 1 Kg)',x.portion||x.unit);if(portion===null)return;x.en=en.trim()||x.en;x.ur=ur.trim()||x.en;x.ro=ro.trim()||x.en;x.cat=catName.trim()||x.cat;x.price=Number(price);x.unit=unit.trim()||x.unit;x.portion=portion.trim()||x.unit;save();menuPage(document.getElementById('main'))}function deleteDish(id){if(confirm('Delete this dish?')){db.items=db.items.filter(x=>x.id!==id);save();menuPage(document.getElementById('main'))}}
function counter(m){let list=db.items.filter(x=>(cat==='All'||x.cat===cat)&&[x.en,x.ur,x.ro].join(' ').toLowerCase().includes(search.toLowerCase()));m.innerHTML=`<div class="pagehead"><div><h2>${T('counterTitle')}</h2><p class="muted">Fast billing · portions · kg · packets</p></div><span class="tag">S SMART BILLING</span></div><div class="posgrid"><section class="panel"><div class="toolbar"><input placeholder="${T('search')}" value="${search}" oninput="search=this.value;counter(document.getElementById('main'))"></div><div class="categoryrow">${cats.map(c=>`<button class="${cat===c?'active':''}" onclick="cat='${c}';counter(document.getElementById('main'))">${c}</button>`).join('')}</div><div class="menu-grid">${list.map(x=>`<div class="dish"><div class="dishname">${dishName(x)}</div><div class="sub">${x.cat} · ${x.portion||x.unit}</div><div class="price">${money(x.price)} / ${x.unit}</div><button onclick="addCart(${x.id})">＋ Add</button></div>`).join('')}</div></section><section class="panel"><h3>${T('cart')}</h3><div class="field"><label>${T('customer')}</label><input id="customer" value="${db.customer}" oninput="db.customer=this.value;save()"></div><div class="field"><label>${T('orderType')}</label><select id="orderType" onchange="db.orderType=this.value;save()"><option ${db.orderType==='Dine In'?'selected':''}>Dine In</option><option ${db.orderType==='Take Away'?'selected':''}>Take Away</option><option ${db.orderType==='Delivery'?'selected':''}>Delivery</option></select></div><div id="cartItems">${cartHTML()}</div><div class="formgrid"><div class="field"><label>${T('discount')}</label><input type="number" min="0" value="${db.discount}" onchange="db.discount=Math.max(0,+this.value);save();counter(document.getElementById('main'))"></div><div class="field"><label>${T('gst')}</label><input type="number" min="0" value="${db.gst}" onchange="db.gst=Math.max(0,+this.value);save();counter(document.getElementById('main'))"></div></div><div class="totals" id="totals">${totalsHTML()}</div><div class="quick" style="margin-top:15px"><button class="gold" style="flex:1" onclick="completeOrder()">${T('pay')}</button><button class="soft" onclick="clearCart()">Clear</button></div></section></div>`}
function cartHTML(){return db.cart.length?db.cart.map((x,i)=>`<div class="cartline"><div><b>${x.name}</b><small>${x.unit} · ${money(x.price)} each</small><div class="qty"><button onclick="changeQty(${i},-1)">−</button>${x.qty}<button onclick="changeQty(${i},1)">＋</button><button class="danger" onclick="removeCart(${i})">×</button></div></div><b>${money(x.price*x.qty)}</b></div>`).join(''):'<div class="empty">Order abhi khali hai</div>'}
function totals(){let sub=db.cart.reduce((s,x)=>s+x.price*x.qty,0),disc=Math.min(sub,db.discount),tax=Math.max(0,sub-disc)*db.gst/100;return{sub,disc,tax,total:sub-disc+tax}}
function totalsHTML(){let t=totals();return `<div class="totalrow"><span>${T('subtotal')}</span><b>${money(t.sub)}</b></div><div class="totalrow"><span>${T('discount')}</span><b>− ${money(t.disc)}</b></div><div class="totalrow"><span>GST</span><b>${money(t.tax)}</b></div><div class="totalrow grand"><span>${T('total')}</span><b>${money(t.total)}</b></div>`}
function addCart(id){let x=db.items.find(a=>a.id===id),found=db.cart.find(a=>a.id===id);if(found)found.qty++;else db.cart.push({id:x.id,name:x.en,ur:x.ur,ro:x.ro,price:x.price,unit:x.unit,qty:1});save();counter(document.getElementById('main'))}function changeQty(i,d){db.cart[i].qty+=d;if(db.cart[i].qty<=0)db.cart.splice(i,1);save();counter(document.getElementById('main'))}function removeCart(i){db.cart.splice(i,1);save();counter(document.getElementById('main'))}function clearCart(){db.cart=[];db.discount=0;save();counter(document.getElementById('main'))}
function completeOrder(){if(!db.cart.length){alert('Pehle menu se item add karein');return}let t=totals(),o={id:'S'+Date.now().toString().slice(-7),time:Date.now(),date:dateKey(),customer:db.customer||'Walk-in Customer',type:db.orderType,items:db.cart.map(x=>({...x})),subtotal:t.sub,discount:t.disc,gst:t.tax,total:t.total};db.orders.push(o);db.lastOrder=o;db.cart=[];db.discount=0;save();counter(document.getElementById('main'));if(confirm('Bill save ho gaya. Print karein?'))printBill(o)}
function ordersTable(arr){return arr.length?`<div class="tablewrap"><table><thead><tr><th>Bill No.</th><th>Date / Time</th><th>Customer</th><th>Items</th><th>Total</th><th>Action</th></tr></thead><tbody>${arr.map(o=>`<tr><td>${o.id}</td><td>${fmtDate(o.time)}</td><td>${o.customer}</td><td>${o.items.reduce((s,x)=>s+x.qty,0)}</td><td><b>${money(o.total)}</b></td><td><button class="soft" onclick="printBillById('${o.id}')">Print</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Abhi koi sale record nahi</div>'}
function salesPage(m){let sum=totalSales(db.orders);m.innerHTML=`<div class="pagehead"><div><h2>${T('sales')}</h2><p class="muted">Complete transaction history</p></div><button class="gold" onclick="exportCSV()">⇩ ${T('export')}</button></div><div class="grid"><div class="stat"><label>Total Revenue</label><strong>${money(sum)}</strong></div><div class="stat"><label>Total Bills</label><strong>${db.orders.length}</strong></div><div class="stat"><label>Discount Given</label><strong>${money(db.orders.reduce((s,o)=>s+o.discount,0))}</strong></div><div class="stat"><label>GST Collected</label><strong>${money(db.orders.reduce((s,o)=>s+o.gst,0))}</strong></div></div><section class="panel" style="margin-top:15px"><h3>${T('reports')}</h3>${ordersTable(db.orders.slice().reverse())}</section>`}
function settingsPage(m){let l=license();m.innerHTML=`<div class="pagehead"><div><h2>${T('settingsTitle')}</h2><p class="muted">Aap ke control mein business aur access</p></div><span class="tag">OWNER CONTROL</span></div><div class="columns"><section class="panel"><h3>Business Profile</h3><div class="field"><label>${T('business')}</label><input id="businessName" value="${db.name}"></div><div class="field"><label>Currency</label><select id="currency"><option>Rs.</option><option>PKR</option></select></div><div class="field"><label>${T('pin')}</label><input id="ownerPin" type="password" value="${db.ownerPin}"></div><button class="gold" onclick="saveSettings()">Save Settings</button><div class="switchline"><span>Print language / bill mein teen zaban ke naam</span><span class="tag">EN · UR · ROMAN</span></div><div class="switchline"><span>Menu aur sales CSV export</span><button class="soft" onclick="exportCSV()">Export</button></div><div class="switchline"><span>Print menu</span><button class="soft" onclick="printMenu()">Print</button></div></section><section class="panel"><h3>License & Activation</h3><div class="notice">Demo security: 20 din ka local trial. Expiry ke baad app lock ho jata hai. Owner PIN se activation code banayein / customer ko dein.</div><div class="stat"><label>${T('days')}</label><strong>${l.active?'Active':l.left+' days left'}</strong><small>${l.active?'Activated until '+fmtDate(db.licenseUntil):'Trial starts on this device'}</small></div><div class="field"><label>Customer Device Activation Code</label><input id="activationCode" placeholder="Enter activation code"></div><button onclick="activateCode()">Activate Device</button><div class="field"><label>Owner PIN (default 7860) + License Code Generator</label><input id="licensePin" type="password" placeholder="Owner PIN"></div><div class="formgrid"><div class="field"><label>Days to activate</label><input id="licenseDays" type="number" value="365"></div><div class="field"><label>Generated code</label><input id="generatedCode" readonly placeholder="Code will show here"></div></div><div class="quick"><button class="gold" onclick="generateCode()">Generate Code</button><button class="soft" onclick="copyCode()">Copy Code</button></div><p class="muted" style="font-size:11px">WhatsApp par code share kar sakte hain. Automatic remote blocking/activation ke liye secure online database aur server integration alag se connect karna hoga.</p></section></div><section class="panel" style="margin-top:15px"><h3>Data Management</h3><div class="quick"><button class="soft" onclick="backupData()">Download Backup</button><button class="danger" onclick="resetData()">${T('reset')}</button></div></section>`}
function saveSettings(){db.name=document.getElementById('businessName').value.trim()||'AGHAI 21 PAKWAN CENTER';db.ownerPin=document.getElementById('ownerPin').value||'7860';db.currency=document.getElementById('currency').value;save();render();alert('Settings saved')}
function makeCode(pin,days){return 'S'+btoa(pin+'|'+days+'|AGHAI').replace(/[^A-Z0-9]/gi,'').toUpperCase().slice(0,12)}function generateCode(){let pin=document.getElementById('licensePin').value;if(pin!==db.ownerPin){alert('Wrong owner PIN');return}let days=Math.max(1,Math.min(3650,Number(document.getElementById('licenseDays').value)||365));document.getElementById('generatedCode').value=makeCode(pin,days)}function copyCode(){let v=document.getElementById('generatedCode').value;if(v)navigator.clipboard?.writeText(v).then(()=>alert('Copied'));else alert('Pehle code generate karein')}
function activateCode(){let code=document.getElementById('activationCode').value.trim();let valid=false;for(let d=1;d<=3650;d++)if(code===makeCode(db.ownerPin,d)){db.licenseUntil=Date.now()+d*86400000;valid=true;break}if(!valid){alert('Invalid activation code');return}save();alert('License activated');render()}

function printMenu(){let w=window.open('','_blank','width=800,height=700');if(!w){alert('Popup allow karein');return}w.document.write(`<html><head><title>Menu</title><style>body{font:14px Arial;padding:25px;color:#111}.logo{text-align:center;font:bold 42px Georgia;color:#17483d}h1{text-align:center}h2{border-bottom:1px solid #777;padding-bottom:5px} .item{display:flex;justify-content:space-between;border-bottom:1px dotted #aaa;padding:7px}.muted{font-size:11px;color:#555}</style></head><body><div class="logo">S</div><h1>${db.name} · MENU</h1>${cats.slice(1).map(c=>{let a=db.items.filter(x=>x.cat===c);return a.length?`<h2>${c}</h2>${a.map(x=>`<div class="item"><span>${x.en}<br><span class="muted">${x.ur} · ${x.ro}</span></span><b>${money(x.price)} / ${x.unit}</b></div>`).join('')}`:''}).join('')}<p style="text-align:center">Powered by S</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function exportCSV(){let rows=[['Bill','Date','Customer','Type','Items','Subtotal','Discount','GST','Total'],...db.orders.map(o=>[o.id,fmtDate(o.time),o.customer,o.type,o.items.map(x=>x.name+' x'+x.qty).join('; '),o.subtotal,o.discount,o.gst,o.total])];let csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='AGHAI-Pakwan-Sales.csv';a.click();URL.revokeObjectURL(a.href)}function backupData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='AGHAI-Pakwan-Backup.json';a.click();URL.revokeObjectURL(a.href)}function resetData(){if(confirm('Reset all demo data? This cannot be undone.')){localStorage.removeItem('aghaiPakwanDB');location.reload()}}

op:2px}.menu-price{white-space:nowrap;text-align:right;font-size:10px;font-weight:bold;color:#9a6d24}.menu-price small{display:block;font-size:8px;color:#777;font-weight:normal}.menu-footer{text-align:center;border-top:1px solid #c49a4c;padding:9px 2px 2px;font:italic 10px Georgia;color:#87642b}@media print{.menu-card{print-color-adjust:exact;-webkit-print-color-adjust:exact}.menu-section{break-inside:avoid}}@media(max-width:500px){.menu-catalog{grid-template-columns:1fr}}</style>`;printPreview('AGHAI Menu Card','A4',html);}
